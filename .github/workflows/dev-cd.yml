name: "[DEV] Build and Deploy"

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 서브모듈을 포함하여 체크아웃
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          ssh-key: ${{ secrets.SUBMODULES_SSH_KEY }}

      # 서브모듈 유효성 검증
      - name: Verify secret submodule
        run: |
          echo "서브모듈 상태 확인 중..."
          git submodule status src/main/resources/secret
          
          # 서브모듈 초기화 여부 확인
          if git submodule status src/main/resources/secret | grep -q '^-'; then
            echo "❌ 오류: 서브모듈이 초기화되지 않았습니다"
            exit 1
          fi
          
          # 서브모듈 커밋 버전 확인
          if git submodule status src/main/resources/secret | grep -q '^+'; then
            echo "⚠️  경고: 서브모듈이 커밋된 버전과 다릅니다"
            git submodule status src/main/resources/secret
          fi
          
          # 실제 파일 존재 확인
          if [ ! -f src/main/resources/secret/application-secret.yml ]; then
            echo "❌ 오류: application-secret.yml 파일을 찾을 수 없습니다"
            ls -la src/main/resources/secret/ || true
            exit 1
          fi
          
          echo "✅ 서브모듈 검증 완료"
          ls -la src/main/resources/secret/application-secret.yml

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "src,gradle,gradlew,gradlew.bat,build.gradle,settings.gradle,docker-compose.dev.yml,Dockerfile"
          target: ${{ secrets.EC2_PATH }}/backend
          overwrite: true
          debug: true

      - name: Build & Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            # Move to the project directory
            cd ${{ secrets.EC2_PATH }}/backend
            
            # Ensure permissions
            chmod +x gradlew
            
            # Check for docker compose
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Installing compose plugin..."
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin || true
              COMPOSE="docker compose"
            fi
            
            echo "Using: $COMPOSE"
            
            # Start services using dev compose file
            sudo $COMPOSE -f docker-compose.dev.yml up -d --build
            sudo $COMPOSE -f docker-compose.dev.yml ps
            
            # Logs (optional, just to verify startup)
            sudo docker logs spring_boot_dev --tail=50 || true
            sudo docker logs spring_boot_redis_dev --tail=20 || true
