name: Deploy to Dev via SSH

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules (SSH Deploy Key)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          ssh-key: ${{ secrets.SUBMODULES_SSH_KEY }}

      - name: Verify env submodule
        run: ls -la env/dev || (echo "env/dev missing" && exit 1)

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # Copy backend and env directories
          source: "./**,env/dev/.env"
          target: ${{ secrets.EC2_PATH }}/backend
          overwrite: true
          debug: true

      - name: Prepare docker on EC2 (install/enable if needed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y docker.io docker-compose-plugin
                sudo systemctl enable --now docker
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker
                sudo systemctl enable --now docker
              fi
            else
              sudo systemctl start docker || true
            fi
            docker --version || true
            docker compose version || true

      - name: Build & Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            # Move to the project directory
            cd ${{ secrets.EC2_PATH }}/backend
            
            # Ensure permissions
            chmod +x gradlew
            
            # Check for docker compose
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Installing compose plugin..."
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin || true
              COMPOSE="docker compose"
            fi
            
            echo "Using: $COMPOSE"
            
            # Start services using dev compose file
            sudo $COMPOSE -f docker-compose.dev.yml up -d --build
            sudo $COMPOSE -f docker-compose.dev.yml ps
            
            # Logs (optional, just to verify startup)
            sudo docker logs spring_boot_dev --tail=50 || true
            sudo docker logs spring_boot_redis_dev --tail=20 || true
