spring:
  config:
    import: "optional:classpath:secret/application-secret.yml"
  application:
    name: backend
  
  profiles:
    active: ${app.env}

  datasource:
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${mysql.user}
    password: ${mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    
  data:
    mongodb:
      uri: mongodb://${mongo.user}:${mongo.password}@${mongo.host}:${mongo.port}/${mongo.db}?authSource=${mongo.auth-source}
    redis:
      host: ${redis.host:localhost}
      port: 6379
  
  elasticsearch:
    uris: http://${elasticsearch.host}:${elasticsearch.port}
    

cloud:
  aws:
    region:
      static: ${aws.region}
    s3:
      bucket: ${aws.s3.bucket}

app:
  jwt:
    secret: ${jwt.secret}
    expiration: ${jwt.expiration}
  cors:
    origins: ${cors.origins}
  gpu-server:
    url: ${gpu-server.url}


---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
