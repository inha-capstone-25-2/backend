spring:
  application:
    name: backend
    
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rsrs}
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:1234}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:arxiv}?authSource=${MONGO_AUTH_SOURCE:admin}
      
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

cloud:
  aws:
    region:
      static: ${AWS_DEFAULT_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:inha-capstone-02-arxiv}

# Custom Application Config
app:
  jwt:
    secret: ${SECRET_KEY:dev-secret-change-me}
    expiration: ${ACCESS_TOKEN_EXPIRE_MINUTES:60}
    
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
    
  gpu-server:
    url: ${GPU_SERVER:http://35.90.139.246:8000}
    
  # Prod Mongo (If needed for specific services)
  prod-mongo:
    host: ${PROD_MONGO_HOST:35.86.219.39}
    port: ${PROD_MONGO_PORT:27017}
    user: ${PROD_MONGO_USER:rsrs-root}
    password: ${PROD_MONGO_PASSWORD:KIQu3jebjHNhTEE6mm5tgj2oNjYr7J805k2JLbE0AVo}
    db: ${PROD_MONGO_DB:arxiv}
