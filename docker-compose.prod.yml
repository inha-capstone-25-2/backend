version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_prod
    env_file:
      - env/prod/.env
    environment:
      APP_ENV: prod
      KAGGLE_CONFIG_DIR: /root/.kaggle
      DATA_DIR: /app/data
      REDIS_HOST: redis
    volumes:
      - ./.kaggle:/root/.kaggle:ro
      - ./data:/app/data
      - ./env:/app/env:ro
    ports:
      - "80:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker_prod
    command: celery -A app.celery worker --loglevel=info --concurrency=2
    env_file:
      - env/prod/.env
    environment:
      APP_ENV: prod
      KAGGLE_CONFIG_DIR: /root/.kaggle
      DATA_DIR: /app/data
      REDIS_HOST: redis
    volumes:
      - ./.kaggle:/root/.kaggle:ro
      - ./data:/app/data
      - ./env:/app/env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Redis
  redis:
    image: redis:7
    container_name: redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: always

volumes:
  redis_data: