version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_boot_prod
    env_file:
      - ../env/prod/.env
    environment:
      APP_ENV: prod
      REDIS_HOST: redis
    ports:
      - "80:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Redis
  redis:
    image: redis:7
    container_name: spring_boot_redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: always

volumes:
  redis_data_prod:
