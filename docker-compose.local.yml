version: '3.8'

services:
  # FastAPI
  app:
    image: python:3.11-slim
    container_name: fastapi_local
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
      - C:/Users/chosh/.kaggle:/root/.kaggle:ro   # 호스트 Kaggle 자격 증명 마운트
    ports:
      - "8000:8000"
    env_file:
      - env/local/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: python:3.11-slim
    container_name: celery_worker_local
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      celery -A app.celery worker --loglevel=info"
    volumes:
      - .:/app
      - C:/Users/chosh/.kaggle:/root/.kaggle:ro
    env_file:
      - env/local/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL
  # MySQL
  mysql:
    image: mysql:8
    container_name: mysql_local
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: rsrs
      MYSQL_USER: root
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  # MongoDB
  mongo:
    image: mongo:6
    container_name: mongodb_local
    env_file:
      - env/local/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "pgrep mongod >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Redis
  redis:
    image: redis:7
    container_name: redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
  mongo_data:
  redis_data:
